# Render Deployment Blueprint for TeleThread
# Free-tier cloud deployment: FastAPI Python Web Service + Vite React Static PWA

services:
  # 1. Backend REST API & WebRTC Signalling Server
  - type: web
    name: telethread-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DATABASE_URL
        value: sqlite:///./telethread.db
      - key: GEMINI_API_KEY
        sync: false

  # 2. Frontend React PWA Static Site (Global Edge CDN - No region field)
  - type: web
    name: telethread-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: telethread-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
